name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff==0.14.4
      - run: ruff check --output-format=github .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is what Proxmox VE 8 (Debian 12) ships.
        python-version: ['3.9', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        # The tests stub out every Proxmox call, so pandas/scikit-learn are not
        # needed. prometheus-client is included so the metrics path is covered.
        run: pip install Flask==3.1.3 PyYAML==6.0.1 requests prometheus-client==0.19.0 pytest==8.4.2
      - name: Run tests
        run: pytest

  install-requirements:
    name: Resolve runtime requirements
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install the pinned runtime dependencies
        run: pip install -r requirements.txt
      - name: Byte-compile every module
        run: python -m compileall -q lxc_autoscale_ml

  shell:
    name: Shell scripts (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: shellcheck install.sh uninstall.sh
